# Trivy Operator (https://aquasecurity.github.io/trivy-operator): what it found scanning the cluster.
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: trivy-operator
spec:
  version: 1.2.0
  needs:
    lumovi: 1.23.0
  groups:
    - aquasecurity.github.io
  label: Trivy
  icon: bug
  kinds:
    - { group: aquasecurity.github.io, kind: VulnerabilityReport }
    - { group: aquasecurity.github.io, kind: ConfigAuditReport }
    - { group: aquasecurity.github.io, kind: ExposedSecretReport }
    - { group: aquasecurity.github.io, kind: RbacAssessmentReport }
    - { group: aquasecurity.github.io, kind: ClusterRbacAssessmentReport }
    - { group: aquasecurity.github.io, kind: ClusterComplianceReport }
  # Its Security page (src/trivy-operator): what to fix first, then everything else Trivy found;
  # and a tab on a VulnerabilityReport, every vulnerability in its image. Drawn from its own
  # reports, read field by field, never what a view withholds. Nothing is scanned, fixed or looked
  # up anywhere.
  pages:
    - { id: security, title: Security }
  tabs:
    - id: vulnerabilities
      title: Vulnerabilities
      kinds: [{ group: aquasecurity.github.io, kind: VulnerabilityReport }]
  # Of Kubernetes' own, ReplicaSets: whose each is and whether it runs pods, never what they run.
  # Trivy scans a Deployment's ReplicaSet, so a ReplicaSet's report is said as its Deployment's.
  reads:
    - group: apps
      kind: ReplicaSet
      fields:
        [
          metadata.name,
          metadata.namespace,
          metadata.creationTimestamp,
          metadata.ownerReferences,
          spec.replicas,
          status.replicas,
        ]
  # Lumovi's own lists a workload's row on the page goes to, at that one object: never read, never
  # changed (src/trivy-operator/pages.ts's OPENS, the same kinds).
  opens:
    - { group: apps, kind: Deployment }
    - { group: apps, kind: StatefulSet }
    - { group: apps, kind: DaemonSet }
    - { group: apps, kind: ReplicaSet }
    - { group: batch, kind: CronJob }
    - { group: batch, kind: Job }
    - { group: "", kind: Pod }
  views:
    # A report for each container image a workload runs.
    - name: trivy-vulnerability-reports
      kinds:
        - { group: aquasecurity.github.io, kind: VulnerabilityReport }
      icon: bug
      columns:
        - { name: Workload, path: ".metadata.labels['trivy-operator.resource.name']" }
        - { name: Container, path: ".metadata.labels['trivy-operator.container.name']" }
        - { name: Image, path: .report.artifact.repository }
        - { name: Critical, path: .report.summary.criticalCount, type: number, default: '0' }
        - { name: High, path: .report.summary.highCount, type: number, default: '0' }
        - { name: Medium, path: .report.summary.mediumCount, type: number, default: '0' }
      status:
        - when:
            all:
              - { path: .report.summary.criticalCount, exists: true }
              - { path: .report.summary.criticalCount, notEquals: 0 }
          health: critical
          label: '{{ .report.summary.criticalCount }} critical'
          detail: '{{ .report.vulnerabilities[?(@.severity=="CRITICAL")].vulnerabilityID }}'
        - when:
            all:
              - { path: .report.summary.highCount, exists: true }
              - { path: .report.summary.highCount, notEquals: 0 }
          health: warning
          label: '{{ .report.summary.highCount }} high'
          detail: '{{ .report.vulnerabilities[?(@.severity=="HIGH")].vulnerabilityID }}'
        - health: healthy
          label: No critical or high
      details:
        - { name: Workload, path: ".metadata.labels['trivy-operator.resource.kind']" }
        - { name: Image, path: .report.artifact.repository }
        - { name: Tag, path: .report.artifact.tag }
        - { name: Digest, path: .report.artifact.digest }
        - { name: OS, path: .report.os.name }
        - { name: Scanned, path: .report.updateTimestamp, type: date }
        - { name: Low, path: .report.summary.lowCount, type: number, default: '0' }
        - { name: Unknown, path: .report.summary.unknownCount, type: number, default: '0' }
        - {
            name: Critical,
            path: '.report.vulnerabilities[?(@.severity=="CRITICAL")].vulnerabilityID',
          }
        - { name: High, path: '.report.vulnerabilities[?(@.severity=="HIGH")].vulnerabilityID' }
      links:
        - name: Workload
          kind: "{{ .metadata.labels['trivy-operator.resource.kind'] }}"
          objectName: "{{ .metadata.labels['trivy-operator.resource.name'] }}"
    # Misconfigurations and risky RBAC: checks that failed, by severity.
    - name: trivy-findings
      kinds:
        - { group: aquasecurity.github.io, kind: ConfigAuditReport }
        - { group: aquasecurity.github.io, kind: RbacAssessmentReport }
        - { group: aquasecurity.github.io, kind: ClusterRbacAssessmentReport }
      icon: file-check
      columns:
        - { name: Resource, path: ".metadata.labels['trivy-operator.resource.name']" }
        - { name: Critical, path: .report.summary.criticalCount, type: number, default: '0' }
        - { name: High, path: .report.summary.highCount, type: number, default: '0' }
        - { name: Medium, path: .report.summary.mediumCount, type: number, default: '0' }
        - { name: Low, path: .report.summary.lowCount, type: number, default: '0' }
      status:
        - when:
            all:
              - { path: .report.summary.criticalCount, exists: true }
              - { path: .report.summary.criticalCount, notEquals: 0 }
          health: critical
          label: '{{ .report.summary.criticalCount }} critical'
        - when:
            all:
              - { path: .report.summary.highCount, exists: true }
              - { path: .report.summary.highCount, notEquals: 0 }
          health: warning
          label: '{{ .report.summary.highCount }} high'
        - health: healthy
          label: No critical or high
      details:
        - { name: Resource, path: ".metadata.labels['trivy-operator.resource.kind']" }
        - { name: Scanned, path: .report.updateTimestamp, type: date }
      links:
        - name: Resource
          kind: "{{ .metadata.labels['trivy-operator.resource.kind'] }}"
          objectName: "{{ .metadata.labels['trivy-operator.resource.name'] }}"
    # Secrets found in images, by severity. The line each was found on is never shown: Trivy
    # stars the secret, not what's around it.
    - name: trivy-exposed-secret-reports
      kinds:
        - { group: aquasecurity.github.io, kind: ExposedSecretReport }
      icon: file-check
      columns:
        - { name: Resource, path: ".metadata.labels['trivy-operator.resource.name']" }
        - { name: Critical, path: .report.summary.criticalCount, type: number, default: '0' }
        - { name: High, path: .report.summary.highCount, type: number, default: '0' }
        - { name: Medium, path: .report.summary.mediumCount, type: number, default: '0' }
        - { name: Low, path: .report.summary.lowCount, type: number, default: '0' }
      status:
        - when:
            all:
              - { path: .report.summary.criticalCount, exists: true }
              - { path: .report.summary.criticalCount, notEquals: 0 }
          health: critical
          label: '{{ .report.summary.criticalCount }} critical'
        - when:
            all:
              - { path: .report.summary.highCount, exists: true }
              - { path: .report.summary.highCount, notEquals: 0 }
          health: warning
          label: '{{ .report.summary.highCount }} high'
        - health: healthy
          label: No critical or high
      details:
        - { name: Resource, path: ".metadata.labels['trivy-operator.resource.kind']" }
        - { name: Scanned, path: .report.updateTimestamp, type: date }
        - { name: Secrets found, path: '.report.secrets[*].title' }
      links:
        - name: Resource
          kind: "{{ .metadata.labels['trivy-operator.resource.kind'] }}"
          objectName: "{{ .metadata.labels['trivy-operator.resource.name'] }}"
      withholds:
        - path: report.secrets.match
          why: The line where Trivy found a secret, which can give the secret away.
    - name: trivy-compliance-reports
      kinds:
        - { group: aquasecurity.github.io, kind: ClusterComplianceReport }
      icon: file-check
      columns:
        - { name: Standard, path: .spec.compliance.title }
        - { name: Failing, path: .status.summary.failCount, type: number, default: '0' }
        - { name: Passing, path: .status.summary.passCount, type: number, default: '0' }
        - { name: Schedule, path: .spec.cron }
      status:
        - when:
            all:
              - { path: .status.summary.failCount, exists: true }
              - { path: .status.summary.failCount, notEquals: 0 }
          health: warning
          label: '{{ .status.summary.failCount }} failing'
        - when: { path: .status.summary.passCount, exists: true }
          health: healthy
          label: Compliant
      details:
        - { name: Standard, path: .spec.compliance.title }
        - { name: Version, path: .spec.compliance.version }
        - { name: Schedule, path: .spec.cron }
        - { name: Report, path: .spec.reportType }

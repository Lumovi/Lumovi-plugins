# Argo CD (https://argo-cd.readthedocs.io).
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: argo-cd
spec:
  version: 1.4.0
  needs:
    lumovi: 1.22.0
  groups:
    - argoproj.io
  label: Argo CD
  icon: git-branch
  kinds:
    - { group: argoproj.io, kind: Application }
    - { group: argoproj.io, kind: ApplicationSet }
    - { group: argoproj.io, kind: AppProject }
  # Its Overview, every Application in one table, and a tab on an Application (src/argo-cd), drawn
  # from its own kinds, and, where an Application deploys to this cluster, from the ReplicaSets and
  # Pods it manages; and, from the tab, Sync, Refresh, Delete and auto-sync turned on or off, each
  # confirmed by the person in Lumovi's own dialog. (Lumovi's own bar, above every tab, has the
  # view's Sync, Terminate sync and Refresh, below.)
  pages:
    - { id: overview, title: Overview }
    - { id: applications, title: All applications }
  tabs:
    - { id: application, title: Argo CD, kinds: [{ group: argoproj.io, kind: Application }] }
  # Of Kubernetes' own, ReplicaSets and Pods: who made each and how ready it is, never what they
  # run; and their warning events. Its code reads them only where an Application deploys to this
  # cluster, in its namespace, and only the events of those that aren't well; the file lets it
  # read these fields wherever you can.
  reads:
    - group: apps
      kind: ReplicaSet
      fields:
        [
          metadata.name,
          metadata.namespace,
          metadata.ownerReferences,
          spec.replicas,
          status.replicas,
          status.readyReplicas,
        ]
      events: true
    - group: ''
      kind: Pod
      fields:
        [
          metadata.name,
          metadata.namespace,
          metadata.ownerReferences,
          status.phase,
          status.containerStatuses.ready,
          status.containerStatuses.restartCount,
        ]
      events: true
  changes:
    - { group: argoproj.io, kind: Application, actions: [patch, delete] }
  # Lumovi's own lists a resource's row on the tab goes to, at that one object: never read, never
  # changed (src/argo-cd/pages.ts's OPENS, the same kinds).
  opens:
    - { group: apps, kind: Deployment }
    - { group: apps, kind: StatefulSet }
    - { group: apps, kind: DaemonSet }
    - { group: "", kind: Service }
    - { group: "", kind: ConfigMap }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: batch, kind: Job }
    - { group: batch, kind: CronJob }
  views:
    - name: argo-cd-applications
      kinds:
        - { group: argoproj.io, kind: Application }
      icon: git-branch
      # What an Application tracks by annotation carries its tracking id: the Application's
      # name (with its namespace where Applications live in any), then what it is and where.
      # (Tracking by the app.kubernetes.io/instance label can't be told from any chart's own.)
      manages:
        - annotations:
            argocd.argoproj.io/tracking-id: '{{ .metadata.name }}:{{ object.group }}/{{ object.kind }}:{{ object.namespace }}/{{ object.name }}'
        - annotations:
            argocd.argoproj.io/tracking-id: '{{ .metadata.namespace }}_{{ .metadata.name }}:{{ object.group }}/{{ object.kind }}:{{ object.namespace }}/{{ object.name }}'
      columns:
        - { name: Sync, path: .status.sync.status }
        - { name: Repository, path: .spec.source.repoURL }
        - { name: Path, path: .spec.source.path }
        - { name: Namespace, path: .spec.destination.namespace }
      status:
        - when: { path: .status.health.status, equals: Healthy }
          health: healthy
          label: Healthy
        - when: { path: .status.health.status, equals: Progressing }
          health: progressing
          label: Progressing
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Degraded }
          health: critical
          label: Degraded
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Missing }
          health: warning
          label: Missing
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Suspended }
          health: neutral
          label: Suspended
        - health: neutral
          label: '{{ .status.health.status ?? "Unknown" }}'
      details:
        - { name: Project, path: .spec.project }
        - { name: Sync, path: .status.sync.status }
        - { name: Repository, path: .spec.source.repoURL }
        - { name: Path, path: .spec.source.path }
        - { name: Target revision, path: .spec.source.targetRevision, default: HEAD }
        - { name: Synced revision, path: .status.sync.revision }
        # (Its cluster by name, or by its server: an Application gives one or the other.)
        - { name: Namespace, path: .spec.destination.namespace }
        - { name: Cluster, path: .spec.destination.name }
        - { name: Cluster server, path: .spec.destination.server }
        - { name: Last synced, path: .status.operationState.finishedAt, type: date }
        - { name: Last checked, path: .status.reconciledAt, type: date }
      links:
        - name: Namespace
          kind: Namespace
          objectName: '{{ .spec.destination.namespace }}'
      # In Lumovi's own bar and a row's menu, wherever it is: Sync and Terminate sync ask first, and
      # Refresh runs at once. (The tab's Sync… also lets the person pick a revision, prune and the
      # strategy.)
      actions:
        - name: Sync
          icon: refresh-cw
          primary: true
          # Argo CD starts an operation it finds on the application; none may be on it already.
          when: { path: .operation, exists: false }
          # While one is: busy where it was, with how long once Argo CD has started it.
          busy:
            - when: { path: .status.operationState.phase, equals: Terminating }
              word: Terminating
              since: .status.operationState.startedAt
            - when: { path: .status.operationState.phase, equals: Running }
              word: Syncing
              since: .status.operationState.startedAt
            - when: { path: .operation, exists: true }
              word: Syncing
          confirm: Argo CD brings {{ .metadata.name }} in line with its source, at the revision it tracks. To pick a revision, prune, or choose a strategy, use Sync… on its Argo CD tab.
          patch:
            operation:
              initiatedBy: { username: lumovi }
              sync: { syncStrategy: { hook: {} } }
          done: Started syncing {{ .metadata.name }}
        # Terminate sync: Argo CD's own Terminate for a sync that runs (it sets the phase, on the
        # Application itself: its kind has no status subresource), and, for one asked for that Argo
        # CD hasn't started, the request taken back. Each sent with the version Lumovi judged it on.
        - name: Terminate sync
          icon: square
          primary: true
          when: { path: .status.operationState.phase, equals: Running }
          # The sync it was shown, and no other that started meanwhile.
          same: [.status.operationState.startedAt]
          confirm: Argo CD stops this sync where it is. What it has already applied stays applied, and the rest isn’t applied.
          confirmTitle: Terminate {{ .metadata.name }}’s sync?
          patch: { status: { operationState: { phase: Terminating } } }
          done: Terminating {{ .metadata.name }}’s sync
        - name: Terminate sync
          icon: square
          primary: true
          when:
            all:
              - { path: .operation, exists: true }
              - any:
                  - { path: .status.operationState, exists: false }
                  - { path: .status.operationState.phase, in: [Succeeded, Failed, Error] }
          # The request it was shown, and no other put in its place meanwhile.
          same: [.operation]
          confirm: Argo CD hasn’t started this sync yet. Terminating it takes the request back, so it never runs.
          confirmTitle: Terminate {{ .metadata.name }}’s sync?
          patch: { operation: null }
          done: Took back {{ .metadata.name }}’s sync before it started
        - name: Refresh
          runs: at-once
          icon: radar
          patch:
            metadata:
              annotations: { argocd.argoproj.io/refresh: normal }
          done: Asked Argo CD to compare {{ .metadata.name }} with its source

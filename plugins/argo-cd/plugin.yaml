# Argo CD (https://argo-cd.readthedocs.io).
apiVersion: lumovi.dev/v1beta1
kind: Plugin
metadata:
  name: argo-cd
spec:
  version: 1.2.0
  needs:
    lumovi: 1.22.0
  groups:
    - argoproj.io
  label: Argo CD
  icon: git-branch
  kinds:
    - { group: argoproj.io, kind: Application }
    - { group: argoproj.io, kind: ApplicationSet }
    - { group: argoproj.io, kind: AppProject }
  # Its overview and a tab on an Application (src/argo-cd), drawn from its own kinds alone; and,
  # from the tab, Sync, Refresh and Delete, each confirmed by the person in Lumovi's own dialog.
  # (Beside the view's own Sync and Refresh, below, which stay wherever the tab doesn't run.)
  pages:
    - { id: overview, title: Overview }
  tabs:
    - { id: application, title: Argo CD, kinds: [{ group: argoproj.io, kind: Application }] }
  changes:
    - { group: argoproj.io, kind: Application, actions: [patch, delete] }
  # Lumovi's own lists a resource's row on the tab goes to, at that one object: never read, never
  # changed (src/argo-cd/pages.ts's OPENS, the same kinds).
  opens:
    - { group: apps, kind: Deployment }
    - { group: apps, kind: StatefulSet }
    - { group: apps, kind: DaemonSet }
    - { group: "", kind: Service }
    - { group: "", kind: ConfigMap }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: batch, kind: Job }
    - { group: batch, kind: CronJob }
  views:
    - name: argo-cd-applications
      kinds:
        - { group: argoproj.io, kind: Application }
      icon: git-branch
      # What an Application tracks by annotation carries its tracking id: the Application's
      # name (with its namespace where Applications live in any), then what it is and where.
      # (Tracking by the app.kubernetes.io/instance label can't be told from any chart's own.)
      manages:
        - annotations:
            argocd.argoproj.io/tracking-id: '{{ .metadata.name }}:{{ object.group }}/{{ object.kind }}:{{ object.namespace }}/{{ object.name }}'
        - annotations:
            argocd.argoproj.io/tracking-id: '{{ .metadata.namespace }}_{{ .metadata.name }}:{{ object.group }}/{{ object.kind }}:{{ object.namespace }}/{{ object.name }}'
      columns:
        - { name: Sync, path: .status.sync.status }
        - { name: Repository, path: .spec.source.repoURL }
        - { name: Path, path: .spec.source.path }
        - { name: Destination, path: .spec.destination.namespace }
      status:
        - when: { path: .status.health.status, equals: Healthy }
          health: healthy
          label: Healthy
        - when: { path: .status.health.status, equals: Progressing }
          health: progressing
          label: Progressing
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Degraded }
          health: critical
          label: Degraded
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Missing }
          health: warning
          label: Missing
          detail: '{{ .status.health.message }}'
        - when: { path: .status.health.status, equals: Suspended }
          health: neutral
          label: Suspended
        - health: neutral
          label: '{{ .status.health.status ?? "Unknown" }}'
      details:
        - { name: Project, path: .spec.project }
        - { name: Sync, path: .status.sync.status }
        - { name: Repository, path: .spec.source.repoURL }
        - { name: Path, path: .spec.source.path }
        - { name: Target revision, path: .spec.source.targetRevision, default: HEAD }
        - { name: Synced revision, path: .status.sync.revision }
        - { name: Destination, path: .spec.destination.server }
        - { name: Auto-sync, path: .spec.syncPolicy.automated, type: boolean, default: 'No' }
        - { name: Last synced, path: .status.operationState.finishedAt, type: date }
        - { name: Last checked, path: .status.reconciledAt, type: date }
      links:
        - name: Destination
          kind: Namespace
          objectName: '{{ .spec.destination.namespace }}'
      # (These run at once, on Lumovi's own list, wherever it is. The tab's Sync… and Refresh…,
      # which ask first, run only where a plugin's pages do.)
      actions:
        - name: Sync
          runs: at-once
          icon: refresh-cw
          primary: true
          # Argo CD starts an operation it finds on the application; none may be running already.
          when: { path: .operation, exists: false }
          patch:
            operation:
              initiatedBy: { username: lumovi }
              sync: { syncStrategy: { hook: {} } }
          done: Started syncing {{ .metadata.name }}
        - name: Refresh
          runs: at-once
          icon: radar
          patch:
            metadata:
              annotations: { argocd.argoproj.io/refresh: normal }
          done: Asked Argo CD to compare {{ .metadata.name }} with its repository
